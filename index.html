function metric(p,m){return m==='area'?p.area:m==='population'?p.population:p.density}function ratio(x,y){const r=x/y;return r>=1?(r.toFixed(r>10?1:2)+'×'):(1/r).toFixed((1/r)>10?1:2)+'× smaller'}
function init(){places=countryRows.map(x=>({name:x[0],flag:x[1],area:x[2],population:x[3],density:x[3]/x[2],type:'country'}));places=[...places,...states].sort((x,y)=>x.name.localeCompare(y.name));for(const el of [a,b])el.innerHTML=places.map((p,i)=>`<option value="${i}">${p.flag} ${p.name}</option>`).join('');places.forEach(p=>{const o=document.createElement('option');o.value=p.name;placesList.appendChild(o)});const qs=new URLSearchParams(location.search);setPair(qs.get('a')||'United States',qs.get('b')||'India');renderPresets();render()}
const placesList=document.getElementById('places');function findPlace(q){q=q.toLowerCase();let i=places.findIndex(p=>p.name.toLowerCase()===q);if(i<0)i=places.findIndex(p=>p.name.toLowerCase().includes(q));return i}function setPair(x,y){let i=findPlace(x),j=findPlace(y);if(i>=0)a.value=i;if(j>=0)b.value=j}function bindSearch(inp,sel){inp.onchange=()=>{const i=findPlace(inp.value);if(i>=0){sel.value=i;render()}}}bindSearch(searchA,a);bindSearch(searchB,b);a.onchange=b.onchange=render;
function shapeSvg(p,raw,rawMax,top,cls){const d=shapePaths[p.name]||'M10,10L90,10L90,90L10,90Z';const size=238*raw/rawMax;return `<svg class="shapeSvg ${cls}" viewBox="0 0 100 100" style="width:${size}px;height:${size}px;z-index:${top?3:2}"><path d="${d}"></path></svg>`}
function metricPanel(A,B,key,title,unit){const va=metric(A,key),vb=metric(B,key),max=Math.max(va,vb);const fillA=shapeAreas[A.name]||6400,fillB=shapeAreas[B.name]||6400;const rawA=Math.sqrt(va/fillA),rawB=Math.sqrt(vb/fillB),rawMax=Math.max(rawA,rawB);const bigger=va>=vb?A:B,smaller=va>=vb?B:A,r=Math.max(va,vb)/Math.min(va,vb);return `<div class="metric"><div class="card viz">${shapeSvg(A,rawA,rawMax,rawA<=rawB,'shapeA')}${shapeSvg(B,rawB,rawMax,rawB<rawA,'shapeB')}</div><div><h2>${title}</h2><div class="insight"><b>${bigger.name}</b> is <b>${r.toFixed(r>10?1:2)}×</b> ${key==='density'?'tighter than':'larger than'} ${smaller.name}.</div><div style="margin-top:10px"><div class="small">${A.name}: ${num(va)} ${unit}</div><div class="bar"><div class="fill fa" style="width:${Math.max(2,va/max*100)}%"></div></div><div class="small">${B.name}: ${num(vb)} ${unit}</div><div class="bar"><div class="fill fb" style="width:${Math.max(2,vb/max*100)}%"></div></div><div class="big">${ratio(va,vb)}</div></div></div></div>`}
function render(){const A=places[+a.value],B=places[+b.value];if(!A||!B)return;flagA.textContent=A.flag;flagB.textContent=B.flag;nameA.textContent=A.name;nameB.textContent=B.name;charts.innerHTML=metrics.map(m=>metricPanel(A,B,...m)).join('')}
