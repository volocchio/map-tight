<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>MapTight // Volo Altro</title>
<style>
:root{--bg:#07100e;--panel:#0e1d19;--ink:#ecfff8;--muted:#9fb8ae;--a:#43f2a8;--b:#ffb84d;--bad:#ff5c7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#12342b,#07100e 46%,#020504);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}header{padding:22px max(18px,env(safe-area-inset-left));border-bottom:1px solid #214239;background:#07100ecc;position:sticky;top:0;z-index:2;backdrop-filter:blur(10px)}h1{margin:0;font-size:clamp(30px,7vw,62px);letter-spacing:-.05em}.tag{color:var(--muted);font-size:14px;margin-top:6px}main{max-width:1120px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,#10251f,#0a1714);border:1px solid #24473e;border-radius:18px;padding:16px;box-shadow:0 18px 50px #0008}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #315a50;background:#06110f;color:var(--ink);font-size:16px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}.pill{border:1px solid #315a50;background:#0b1916;color:var(--ink);padding:11px;border-radius:999px;font-weight:700;cursor:pointer}.pill.active{background:var(--a);color:#04100c;border-color:var(--a)}.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:16px}.vs{font-weight:900;color:var(--muted)}.name{font-size:24px;font-weight:900}.flag{font-size:44px}.big{font-size:clamp(30px,7vw,64px);font-weight:900;letter-spacing:-.04em}.small{color:var(--muted)}.bars{margin-top:18px}.bar{height:30px;background:#07100e;border-radius:999px;overflow:hidden;border:1px solid #25493f;margin:8px 0 14px}.fill{height:100%;min-width:2px}.fa{background:linear-gradient(90deg,var(--a),#b7ffd9)}.fb{background:linear-gradient(90deg,var(--b),#ffe0a4)}.viz{height:420px;position:relative;overflow:hidden;display:grid;place-items:center}.square{position:absolute;display:grid;place-items:center;color:#00120c;font-weight:900;text-align:center;border:2px solid #fff8;box-shadow:0 0 30px #0008}.sqA{background:#43f2a8cc}.sqB{background:#ffb84dcc;mix-blend-mode:screen}.insight{font-size:20px;line-height:1.35}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#07100e;border:1px solid #25493f;border-radius:14px;padding:12px}.stat b{display:block;font-size:20px;margin-top:3px}footer{color:#78958b;font-size:12px;padding:20px;text-align:center}@media(max-width:760px){main{padding:12px}.grid,.controls,.list{grid-template-columns:1fr}.versus{grid-template-columns:1fr}.vs{display:none}.viz{height:340px}.card{padding:14px}header{padding:16px}}
</style></head><body><header><h1>MapTight</h1><div class="tag">MapFight-ish, but tighter: area, population, and density in one punchy comparison.</div></header><main>
<div class="grid"><div class="card"><div class="label">Thing A</div><input id="searchA" list="places" placeholder="United States, India, Arizona…"><select id="a"></select></div><div class="card"><div class="label">Thing B</div><input id="searchB" list="places" placeholder="China, Monaco, Texas…"><select id="b"></select></div></div><datalist id="places"></datalist>
<div class="controls"><button class="pill active" data-mode="area">Area</button><button class="pill" data-mode="population">Population</button><button class="pill" data-mode="density">Density</button></div>
<div class="card"><div class="versus"><div><div class="flag" id="flagA"></div><div class="name" id="nameA"></div><div class="big" id="valA"></div><div class="small" id="subA"></div></div><div class="vs">VS</div><div style="text-align:right"><div class="flag" id="flagB"></div><div class="name" id="nameB"></div><div class="big" id="valB"></div><div class="small" id="subB"></div></div></div><div class="bars"><div id="labA" class="small"></div><div class="bar"><div id="barA" class="fill fa"></div></div><div id="labB" class="small"></div><div class="bar"><div id="barB" class="fill fb"></div></div></div></div>
<div class="grid" style="margin-top:14px"><div class="card viz"><div id="sqA" class="square sqA"></div><div id="sqB" class="square sqB"></div></div><div class="card"><div class="label">Tight take</div><div id="insight" class="insight"></div><div class="list" style="margin-top:18px"><div class="stat"><span class="small">Area</span><b id="areaRatio"></b></div><div class="stat"><span class="small">Population</span><b id="popRatio"></b></div><div class="stat"><span class="small">Density</span><b id="denRatio"></b></div></div></div></div>
</main><footer>Includes major countries + selected US states. Density = population / area. Not a legal boundary product, obviously.</footer>
<script>
const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toString();const num=n=>Intl.NumberFormat().format(Math.round(n));
const states=[['Arizona','🇺🇸',295234,7359000],['Texas','🇺🇸',695662,30500000],['California','🇺🇸',423967,38900000],['Alaska','🇺🇸',1723337,734000],['New York State','🇺🇸',141297,19570000],['Florida','🇺🇸',170312,22610000],['Idaho','🇺🇸',216443,1964000],['Montana','🇺🇸',380831,1133000]].map(x=>({name:x[0],flag:x[1],area:x[2],population:x[3],density:x[3]/x[2],type:'US state'}));
const countryRows=[["United States","\ud83c\uddfa\ud83c\uddf8",9833517,340100000],["China","\ud83c\udde8\ud83c\uddf3",9596961,1409700000],["India","\ud83c\uddee\ud83c\uddf3",3287263,1428600000],["Russia","\ud83c\uddf7\ud83c\uddfa",17098246,144400000],["Canada","\ud83c\udde8\ud83c\udde6",9984670,40100000],["Brazil","\ud83c\udde7\ud83c\uddf7",8515767,216400000],["Australia","\ud83c\udde6\ud83c\uddfa",7692024,26700000],["Japan","\ud83c\uddef\ud83c\uddf5",377975,123300000],["Germany","\ud83c\udde9\ud83c\uddea",357114,84600000],["France","\ud83c\uddeb\ud83c\uddf7",551695,68200000],["United Kingdom","\ud83c\uddec\ud83c\udde7",242495,67900000],["Italy","\ud83c\uddee\ud83c\uddf9",301340,58900000],["Spain","\ud83c\uddea\ud83c\uddf8",505990,48600000],["Mexico","\ud83c\uddf2\ud83c\uddfd",1964375,129700000],["Indonesia","\ud83c\uddee\ud83c\udde9",1904569,281600000],["Pakistan","\ud83c\uddf5\ud83c\uddf0",881913,241500000],["Bangladesh","\ud83c\udde7\ud83c\udde9",147570,173600000],["Nigeria","\ud83c\uddf3\ud83c\uddec",923768,223800000],["Egypt","\ud83c\uddea\ud83c\uddec",1002450,112700000],["South Africa","\ud83c\uddff\ud83c\udde6",1221037,62000000],["Argentina","\ud83c\udde6\ud83c\uddf7",2780400,46000000],["Chile","\ud83c\udde8\ud83c\uddf1",756102,19600000],["Monaco","\ud83c\uddf2\ud83c\udde8",2.02,39000],["Singapore","\ud83c\uddf8\ud83c\uddec",734,5920000],["Vatican City","\ud83c\uddfb\ud83c\udde6",0.49,800],["Greenland","\ud83c\uddec\ud83c\uddf1",2166086,56000],["Saudi Arabia","\ud83c\uddf8\ud83c\udde6",2149690,36900000],["Iran","\ud83c\uddee\ud83c\uddf7",1648195,89100000],["Turkey","\ud83c\uddf9\ud83c\uddf7",783562,85300000],["Ukraine","\ud83c\uddfa\ud83c\udde6",603500,37000000]];
let places=[],mode='area';async function load(){places=countryRows.map(x=>({name:x[0],flag:x[1],area:x[2],population:x[3],density:x[3]/x[2],type:'country'}));places=[...places,...states].sort((x,y)=>x.name.localeCompare(y.name));for(const el of [a,b])el.innerHTML=places.map((p,i)=>`<option value="${i}">${p.flag} ${p.name}</option>`).join('');places.forEach((p,i)=>{const o=document.createElement('option');o.value=p.name;placesList.appendChild(o)});let us=places.findIndex(p=>p.name==='United States'), ind=places.findIndex(p=>p.name==='India');a.value=us>=0?us:0;b.value=ind>=0?ind:1;render()}
const placesList=document.getElementById('places');function bindSearch(inp,sel){inp.onchange=()=>{const q=inp.value.toLowerCase();let i=places.findIndex(p=>p.name.toLowerCase()===q);if(i<0)i=places.findIndex(p=>p.name.toLowerCase().includes(q));if(i>=0){sel.value=i;render()}}}bindSearch(searchA,a);bindSearch(searchB,b);a.onchange=b.onchange=render;document.querySelectorAll('.pill').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x===btn));render()});
function metric(p,m){return m==='area'?p.area:m==='population'?p.population:p.density}function unit(m){return m==='area'?'km²':m==='population'?'people':'people/km²'}function ratioText(x,y){const r=x/y;if(r>=1)return r.toFixed(r>10?1:2)+'×';return (1/r).toFixed(1)+'× smaller'}
function render(){const A=places[+a.value],B=places[+b.value];if(!A||!B)return;const va=metric(A,mode),vb=metric(B,mode),max=Math.max(va,vb);flagA.textContent=A.flag;flagB.textContent=B.flag;nameA.textContent=A.name;nameB.textContent=B.name;valA.textContent=fmt(va);valB.textContent=fmt(vb);subA.textContent=unit(mode);subB.textContent=unit(mode);labA.textContent=`${A.name}: ${num(va)} ${unit(mode)}`;labB.textContent=`${B.name}: ${num(vb)} ${unit(mode)}`;barA.style.width=Math.max(2,va/max*100)+'%';barB.style.width=Math.max(2,vb/max*100)+'%';const scale=Math.sqrt(va/max),scaleB=Math.sqrt(vb/max);sqA.style.width=sqA.style.height=(260*scale)+'px';sqB.style.width=sqB.style.height=(260*scaleB)+'px';sqA.textContent=A.name;sqB.textContent=B.name;sqA.style.transform='translate(-45px,-20px)';sqB.style.transform='translate(45px,25px)';areaRatio.textContent=ratioText(A.area,B.area);popRatio.textContent=ratioText(A.population,B.population);denRatio.textContent=ratioText(A.density,B.density);const bigger=va>=vb?A:B,smaller=va>=vb?B:A;const r=Math.max(va,vb)/Math.min(va,vb);insight.innerHTML=`On <b>${mode}</b>, ${bigger.name} is about <b>${r.toFixed(r>10?1:2)}×</b> ${mode==='density'?'tighter than':'larger than'} ${smaller.name}.<br><br>${A.name}: ${num(A.area)} km², ${fmt(A.population)} people, ${num(A.density)} people/km².<br>${B.name}: ${num(B.area)} km², ${fmt(B.population)} people, ${num(B.density)} people/km².`}
load();
</script></body></html>
